services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ninho
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ninho_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ninho"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ninho_data:
